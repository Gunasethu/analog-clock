<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IST Analog Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#161616;--mute:#8a8a8a;--line:#e6e6e6;--red:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff;color:var(--ink);font-family:"DM Sans",-apple-system,"Helvetica Neue",Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;user-select:none;-webkit-user-select:none}
.bar{position:fixed;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font:inherit;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
#snd,.tg{border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;padding:0}
.tools{display:flex;align-items:center;gap:22px}
.tg{display:flex;align-items:center;gap:8px}
.pill{width:26px;height:15px;border-radius:999px;background:#d6d6d6;position:relative;transition:background .15s}
.pill::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-pressed=true] .pill{background:var(--ink)}
.tg[aria-pressed=true] .pill::after{transform:translateX(11px)}
#clock{width:min(76vh,92vw,640px);aspect-ratio:1;flex:none;display:block;touch-action:none;overflow:visible}
.task{cursor:pointer}
.task .vis{transition:stroke-width .18s ease}
.task:hover,.task.sel{opacity:1!important}
.task.show .vis{stroke-width:22px}
.task:hover .vis,.task.sel .vis{stroke-width:26px}
.task .lab{opacity:0;transition:opacity .15s;pointer-events:none;fill:#fff;font-size:13px;font-weight:600;letter-spacing:.02em}
.task.show .lab,.task:hover .lab,.task.sel .lab{opacity:1}
@media (prefers-reduced-motion:reduce){.task .vis,.task .lab{transition:none}}
.num{font-size:28px;font-weight:500;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.lbl{font-size:11px;letter-spacing:.2em;text-anchor:middle;fill:var(--ink)}
#read{letter-spacing:.14em;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
#next{font-size:13px;min-height:18px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:5}
#card{position:fixed;width:288px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:14px;display:flex;flex-direction:column;gap:10px;z-index:6;user-select:text;-webkit-user-select:text}
#card[hidden]{display:none}
#card input,#card textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;color:var(--ink);background:#fff}
#card input:focus,#card textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
#t-title{font-weight:600;font-size:16px;border-color:transparent;padding-left:0}
#t-title:focus{border-color:var(--line);padding-left:9px}
#card textarea{resize:none;height:64px}
.row{display:flex;align-items:center;gap:8px;color:var(--mute)}
#card .row input{flex:1;min-width:0;width:auto;padding:6px;font-size:13px}
.sw{display:flex;gap:8px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.foot{display:flex;justify-content:space-between}
#view,#edit{display:flex;flex-direction:column;gap:10px}
#view[hidden],#edit[hidden]{display:none}
.vt{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;word-break:break-word}
.vt .dot{width:10px;height:10px;border-radius:50%;flex:none}
.vm{color:var(--mute);font-size:13px}
.vn{margin:0;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.vn:empty{display:none}
.foot button{font:inherit;font-size:13px;border:0;background:none;cursor:pointer;padding:6px 4px}
#t-del,#v-del{color:var(--red)}
#t-done,#v-edit{font-weight:600}
</style>
</head>
<body>
<div class="bar">
  <div class="seg"><button id="am">AM</button><button id="pm">PM</button></div>
  <div class="tools"><button id="lbl" class="tg" aria-pressed="false">Show labels<span class="pill"></span></button><button id="snd">Sound off</button></div>
</div>

<svg id="clock" viewBox="0 0 640 640" aria-label="Analog clock with day tasks">
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".1"/></filter></defs>
  <circle cx="320" cy="320" r="258" fill="#f2f2f2" filter="url(#sh)"/>
  <circle cx="320" cy="320" r="250" fill="#fff"/>
  <g id="face"></g>
  <text class="lbl" x="320" y="250" style="font-size:9.5px">INDIA STANDARD TIME</text>
  <rect x="380" y="310" width="56" height="20" rx="6" fill="#fff" stroke="#ddd"/>
  <text id="date" x="408" y="320" class="lbl" style="font-size:9.5px;font-weight:600;letter-spacing:.08em;dominant-baseline:central"></text>
  <g id="tasks"></g>
  <g id="hint">
    <path id="prev" fill="none" stroke="#e3e3e3" stroke-width="10" stroke-linecap="round" opacity="0"/>
    <path id="prev2" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="5 4" opacity="0"/>
    <line id="hdot" stroke="#161616" stroke-width="2.5" stroke-linecap="round" opacity="0"/>
  </g>
  <g id="hh"><line x1="320" y1="320" x2="320" y2="184" stroke="#161616" stroke-width="7" stroke-linecap="round"/></g>
  <g id="mh"><line x1="320" y1="320" x2="320" y2="125" stroke="#161616" stroke-width="4.5" stroke-linecap="round"/></g>
  <g id="sh2"><line x1="320" y1="320" x2="320" y2="103" stroke="#b3261e" stroke-width="1.3"/><circle cx="320" cy="339" r="4" fill="#b3261e"/></g>
  <circle cx="320" cy="320" r="8" fill="#fff" stroke="#b3261e" stroke-width="3"/>
</svg>
<div id="read"></div>
<div id="next"></div>
<div id="tip" hidden></div>

<div id="card" hidden>
  <div id="view">
    <div class="vt"><span class="dot" id="v-dot"></span><span id="v-title"></span></div>
    <div class="vm" id="v-time"></div>
    <p class="vn" id="v-notes"></p>
    <div class="foot"><button id="v-del">Delete</button><button id="v-edit">Edit</button></div>
  </div>
  <div id="edit" hidden>
    <input id="t-title" placeholder="Task name" maxlength="60">
    <div class="row"><input type="time" id="t-start" step="300"><span>to</span><input type="time" id="t-end" step="300"></div>
    <textarea id="t-notes" placeholder="Notes"></textarea>
    <div class="sw" id="t-colors"></div>
    <div class="foot"><button id="t-del">Delete</button><button id="t-done">Done</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',C=320,R=250,ZONE=[205,308];
const COLORS=['#4361ee','#43a047','#d97706','#e11d48','#8b5cf6','#0ea5e9'];
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const pol=(r,a)=>[C+r*Math.sin(a*Math.PI/180),C-r*Math.cos(a*Math.PI/180)];
const pad=n=>String(n).padStart(2,'0');
const tm=m=>{const h=Math.floor(m/60)%24;return `${h%12||12}:${pad(m%60)} ${h<12?'AM':'PM'}`};
const hhmm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const snap=m=>Math.round(m/5)*5;
const ttl=t=>t.title.trim()||'Untitled';
const dur=m=>m>=60?`${Math.floor(m/60)}h${m%60?' '+m%60+'m':''}`:`${m}m`;

/* IST time */
const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
function ist(){const p={};fmt.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return{h:+p.hour%24,m:+p.minute,s:+p.second,wd:p.weekday.toUpperCase(),d:+p.day,key:`${p.year}-${p.month}-${p.day}`}}

/* face */
const face=$('#face'),svg=$('#clock'),tasksG=$('#tasks'),card=$('#card'),tip=$('#tip'),prev=$('#prev'),hdot=$('#hdot');
for(let i=0;i<60;i++){
  const a=i*6,h=i%5===0,c=i%15===0,[x1,y1]=pol(R-4,a),[x2,y2]=pol(R-(c?26:h?20:10),a);
  el('line',{x1,y1,x2,y2,stroke:h?'#161616':'#cfcfcf','stroke-width':c?3.2:h?2.6:1},face);
}
for(let n=1;n<=12;n++){const [x,y]=pol(R*.8,n*30);el('text',{x,y,class:'num'},face).textContent=n}

/* state */
let now=ist(),key=now.key,half=now.h>=12?1:0,tasks=[],sel=null,drag=null;
const load=()=>{try{tasks=JSON.parse(localStorage.getItem('clock-tasks:'+key))||[]}catch(e){tasks=[]}};
const save=()=>{try{localStorage.setItem('clock-tasks:'+key,JSON.stringify(tasks))}catch(e){}};
load();

/* show-labels toggle (remembered) */
let labelsOn=false;try{labelsOn=localStorage.getItem('clock-labels')==='1'}catch(e){}
const lblBtn=$('#lbl'),syncLbl=()=>lblBtn.setAttribute('aria-pressed',labelsOn);
lblBtn.onclick=()=>{labelsOn=!labelsOn;try{localStorage.setItem('clock-labels',labelsOn?'1':'0')}catch(e){}syncLbl();render();const t=cur();if(t&&!card.hidden)place(t)};
syncLbl();

/* arcs */
const arcD=(m0,m1,r)=>{const a0=m0/2,a1=Math.min(m1/2,a0+359.99),[x0,y0]=pol(r,a0),[x1,y1]=pol(r,a1);return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};

function render(){
  const base=half*720,nm=now.h*60+now.m,lanes=[],L={},LS=labelsOn?26:17,gap=labelsOn?12:0; /* gap: minutes kept free between neighbours in a lane, so round caps don't touch */
  const vis=tasks.filter(t=>t.end>base&&t.start<base+720).sort((a,b)=>a.start-b.start);
  vis.forEach(t=>{let i=lanes.findIndex(e=>e+gap<=t.start);if(i<0){i=lanes.length;lanes.push(-1e9)}lanes[i]=t.end;L[t.id]=i});
  tasksG.innerHTML='';
  vis.forEach(t=>{
    const r=266+L[t.id]*LS,m0=Math.max(t.start,base)-base,m1=Math.min(t.end,base+720)-base,d=arcD(m0,m1,r);
    const g=el('g',{class:'task'+(sel===t.id?' sel':'')+(labelsOn?' show':''),'data-id':t.id,role:'button','aria-label':`${ttl(t)}, ${tm(t.start)} to ${tm(t.end)}`},tasksG),live=nm>=t.start&&nm<t.end;
    g.style.opacity=t.end<=nm?(labelsOn?.55:.4):1;
    el('path',{d,fill:'none',stroke:'transparent','stroke-width':LS,'stroke-linecap':'round'},g);
    el('path',{d,class:'vis',fill:'none',stroke:t.color,'stroke-width':live?9:6,'stroke-linecap':'round'},g);
    label(g,t,r,m0,m1);
  });
  $('#am').classList.toggle('on',half===0);$('#pm').classList.toggle('on',half===1);
  renderNext();
}
/* curved label that follows the arc; hidden until hover or selected */
const tlen=n=>{try{return n.getComputedTextLength()}catch(e){return n.textContent.length*6.5}};
const hm=m=>`${Math.floor(m/60)%12||12}:${pad(m%60)}`;
function label(g,t,r,m0,m1){
  const a0=m0/2,a1=Math.min(m1/2,a0+359.99),flip=Math.cos((a0+a1)/2*Math.PI/180)<0; /* lower half: run text backwards so it reads upright */
  const [x0,y0]=pol(r,a0),[x1,y1]=pol(r,a1),big=a1-a0>180?1:0,id='p'+t.id;
  el('path',{id,fill:'none',d:flip?`M${x1} ${y1}A${r} ${r} 0 ${big} 0 ${x0} ${y0}`:`M${x0} ${y0}A${r} ${r} 0 ${big} 1 ${x1} ${y1}`},g);
  const tx=el('text',{class:'lab',dy:'.35em','text-anchor':'middle'},g),tp=el('textPath',{startOffset:'50%'},tx);
  tp.setAttribute('href','#'+id);
  const avail=r*(a1-a0)*Math.PI/180-22;
  let ok=false;
  for(const o of [`${ttl(t)} · ${tm(t.start)} – ${tm(t.end)}`,`${ttl(t)} · ${hm(t.start)}–${hm(t.end)}`,ttl(t)]){
    tp.textContent=o;if(tlen(tp)<=avail){ok=true;break}
  }
  for(let o=ttl(t);!ok&&o.length>1;){o=o.slice(0,-1);tp.textContent=o+'…';ok=tlen(tp)<=avail}
  if(!ok)tx.remove();
}
function renderNext(){
  const nm=now.h*60+now.m,live=tasks.find(t=>nm>=t.start&&nm<t.end);let s;
  if(live)s=`${ttl(live)}: ${live.end-nm} min left`;
  else{const nx=tasks.filter(t=>t.start>nm).sort((a,b)=>a.start-b.start)[0];
    s=nx?`Next: ${ttl(nx)} at ${tm(nx.start)}`:tasks.length?'No more tasks today':'Drag along the rim to add a task'}
  $('#next').textContent=s;
}

/* pointer -> time */
const P=e=>{const r=svg.getBoundingClientRect(),k=640/r.width;return[(e.clientX-r.left)*k-C,(e.clientY-r.top)*k-C]};
const A=p=>{const a=Math.atan2(p[0],-p[1])*180/Math.PI;return a<0?a+360:a};
const inZone=p=>{const d=Math.hypot(p[0],p[1]);return d>=ZONE[0]&&d<=ZONE[1]};
const showTip=(e,t)=>{tip.hidden=false;tip.textContent=t;tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px'};
const clearPrev=()=>{prev.setAttribute('opacity',0);$('#prev2').setAttribute('opacity',0);hdot.setAttribute('opacity',0);tip.hidden=true};

svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.task');
  if(g){select(g.dataset.id);return}
  closeCard();
  const p=P(e);if(!inZone(p))return;
  const a=A(p);drag={s:snap(a*2)%720,last:a,cum:0,lo:0,hi:0};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  const p=P(e),a=A(p),base=half*720;
  if(drag){
    let d=a-drag.last;if(d>180)d-=360;if(d<-180)d+=360;
    drag.cum+=d;drag.last=a;
    const b0=drag.s===0?(drag.cum<0?720:0):drag.s;           /* 12 o'clock can mean start or end of this half */
    const end=Math.min(720,Math.max(0,b0+drag.cum*2));
    drag.lo=snap(Math.min(b0,end));drag.hi=snap(Math.max(b0,end));
    if(drag.hi>drag.lo){
      const pd=arcD(drag.lo,drag.hi,266);[prev,$('#prev2')].forEach(x=>{x.setAttribute('d',pd);x.setAttribute('opacity',1)});hdot.setAttribute('opacity',0);
      const k=drag.lo+':'+drag.hi;if(k!==drag.k){drag.k=k;try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}} /* haptic tick on each 5-min step; only works where the browser supports the Vibration API (Android) */
      showTip(e,`${tm(drag.lo+base)} to ${tm(drag.hi+base)} (${dur(drag.hi-drag.lo)})`);
    }
    return;
  }
  svg.style.cursor=inZone(p)?'crosshair':'default';
  if(inZone(p)&&!e.target.closest('.task')){
    const m=snap(a*2),[x1,y1]=pol(259,m/2),[x2,y2]=pol(277,m/2);
    hdot.setAttribute('x1',x1);hdot.setAttribute('y1',y1);hdot.setAttribute('x2',x2);hdot.setAttribute('y2',y2);hdot.setAttribute('opacity',.85);showTip(e,tm(m+base));
  }else clearPrev();
});
svg.addEventListener('pointerleave',()=>{if(!drag)clearPrev()});
function endDrag(){
  if(!drag)return;const{lo,hi}=drag;drag=null;clearPrev();
  if(hi-lo>=15){
    const t={id:'t'+Date.now(),title:'',notes:'',color:COLORS[tasks.length%COLORS.length],start:lo+half*720,end:hi+half*720};
    tasks.push(t);save();select(t.id,true);
  }
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',()=>{drag=null;clearPrev()});

/* card */
const sw=$('#t-colors');
COLORS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','Color '+c);sw.appendChild(b)});
const cur=()=>tasks.find(t=>t.id===sel);
function fillCard(t){
  $('#v-title').textContent=ttl(t);$('#v-dot').style.background=t.color;
  $('#v-time').textContent=`${tm(t.start)} – ${tm(t.end)} (${dur(t.end-t.start)})`;$('#v-notes').textContent=t.notes;
  $('#t-title').value=t.title;$('#t-start').value=hhmm(t.start%1440);$('#t-end').value=hhmm(t.end%1440);$('#t-notes').value=t.notes;
  sw.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===t.color));
}
function setMode(m){$('#view').hidden=m!=='view';$('#edit').hidden=m!=='edit'}
let isNew=false; /* true only right after a task is created by dragging */
function select(id,edit){
  isNew=!!edit;sel=id;const t=cur();if(!t)return;
  fillCard(t);setMode(edit?'edit':'view');card.hidden=false;render();place(t);
  if(edit){$('#t-title').focus();$('#t-title').select()}
}
function place(t){
  const base=half*720,m=(Math.max(t.start,base)+Math.min(t.end,base+720))/2,a=(m-base)/2*Math.PI/180;
  const r=svg.getBoundingClientRect(),k=r.width/640,x=r.left+(C+300*Math.sin(a))*k,y=r.top+(C-300*Math.cos(a))*k;
  const w=card.offsetWidth,h=card.offsetHeight;
  let l=Math.sin(a)>=0?x+14:x-w-14,tp=y-h/2;
  card.style.left=Math.min(Math.max(8,l),innerWidth-w-8)+'px';
  card.style.top=Math.min(Math.max(8,tp),innerHeight-h-8)+'px';
}
function closeCard(){isNew=false;if(sel===null&&card.hidden)return;sel=null;card.hidden=true;render()}
$('#t-title').addEventListener('input',e=>{const t=cur();if(t){t.title=e.target.value;save();render()}});
$('#t-notes').addEventListener('input',e=>{const t=cur();if(t){t.notes=e.target.value;save()}});
sw.addEventListener('click',e=>{const t=cur(),c=e.target.dataset.c;if(!t||!c)return;t.color=c;save();fillCard(t);render()});
function setTimes(){
  const t=cur();if(!t)return;
  const p=v=>{const [h,m]=v.split(':').map(Number);return h*60+m};
  const s=p($('#t-start').value),e=p($('#t-end').value),day=Math.floor(t.start/1440)*1440;
  if(isNaN(s)||isNaN(e)||e<=s){$('#t-start').value=hhmm(t.start%1440);$('#t-end').value=hhmm(t.end%1440);return}
  t.start=day+s;t.end=day+e;half=Math.floor((t.start%1440)/720);save();fillCard(t);render();place(t);
}
$('#t-start').addEventListener('change',setTimes);$('#t-end').addEventListener('change',setTimes);
const del=()=>{tasks=tasks.filter(t=>t.id!==sel);save();closeCard()};
$('#t-del').onclick=del;$('#v-del').onclick=del;
$('#v-edit').onclick=()=>{const t=cur();if(!t)return;isNew=false;setMode('edit');place(t);$('#t-title').focus()};
$('#t-done').onclick=()=>{const t=cur();if(!t)return;if(isNew){closeCard();return}fillCard(t);setMode('view');place(t)};
document.addEventListener('pointerdown',e=>{const path=e.composedPath();if(!card.hidden&&!path.includes(card)&&!path.includes(svg))closeCard()}); /* composedPath: the clicked arc is rebuilt during the click, so e.target is already detached */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag){drag=null;clearPrev()}else closeCard()}});
$('#am').onclick=()=>{half=0;closeCard();render()};
$('#pm').onclick=()=>{half=1;closeCard();render()};

/* sound */
let sound=false,ctx;
addEventListener('pointerdown',()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}},{once:true});
$('#snd').onclick=()=>{sound=!sound;$('#snd').textContent=sound?'Sound on':'Sound off'};
function tick(){
  if(!sound||!ctx||ctx.state!=='running')return;
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
  o.frequency.value=1800;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.04);
}

/* clock loop */
let lastSec=-1,lastMin=-1;
const rot=(id,a)=>$(id).setAttribute('transform',`rotate(${a} ${C} ${C})`);
function frame(){
  const ms=Date.now(),sec=Math.floor(ms/1000);
  if(sec!==lastSec){
    lastSec=sec;now=ist();
    $('#read').textContent=`${pad(now.h)}:${pad(now.m)}:${pad(now.s)} IST`;
    $('#date').textContent=`${now.wd} ${now.d}`;
    if(now.key!==key){key=now.key;load();sel=null;card.hidden=true}
    if(now.m!==lastMin){lastMin=now.m;render()}else renderNext();
    tick();
  }
  const s=now.s+(ms%1000)/1000;
  rot('#sh2',s*6);rot('#mh',(now.m+s/60)*6);rot('#hh',(now.h%12+now.m/60+s/3600)*30);
  requestAnimationFrame(frame);
}
render();frame();
</script>
